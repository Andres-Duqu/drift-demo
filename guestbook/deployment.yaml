apiVersion: apps/v1
kind: Deployment
metadata:
  name: drift-demo
  labels:
    app: guestbook
spec:
  replicas: 2
  selector:
    matchLabels:
      app: guestbook
  template:
    metadata:
      labels:
        app: guestbook
    spec:
      containers:
      - name: guestbook
        image: registry.k8s.io/hpa-example
        ports:
        - containerPort: 80
